name: CI

# Milestone 11 — stabilize automated validation for the registry-driven CIM.
# Primary gate: pytest. Lint/type tools exist in pyproject optional-deps but are
# not required CI gates (legacy codebase is not yet fully formatted/typed).

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Required by cloud_metrics.utils.config at import time.
      # Registry/migration tests use isolated in-memory SQLite sessions.
      DATABASE_URL: sqlite:///./ci_pytest.db
      CORS_ORIGINS: '["http://localhost:3000"]'
      # Avoid accidental model downloads if embedding classifier is imported.
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run pytest
        run: pytest --maxfail=1 --disable-warnings -q

      - name: Migration smoke (cim_* upgrade/downgrade)
        run: pytest tests/test_cim_registry_migration.py -q --disable-warnings

      - name: End-to-end demo scenarios
        run: pytest tests/test_cim_end_to_end_demo.py -q --disable-warnings
